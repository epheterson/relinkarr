# Weekly version updates, grouped so a quiet week is one pull request per ecosystem.
# Security updates are separate: they come as soon as an advisory lands, whatever the schedule
# (Settings > Code security > Dependabot security updates).
# Quiet mode (Eric, 2026-10-06: "can the checks be silent if nothing"):
# routine version-update PRs are off (limit 0). Dependabot still opens a PR
# only when a security advisory affects a dependency here.
version: 2

updates:
  # Every action is pinned to a commit; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0  # quiet: no routine version PRs; security updates still open
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  # The base image (python:3.12-alpine). A Python minor is a deliberate move.
  - package-ecosystem: docker
    open-pull-requests-limit: 0  # quiet: no routine version PRs; security updates still open
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
